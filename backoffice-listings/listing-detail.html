/* ── OVERVIEW TAB ── */
function CombinedGraph({ revData, bkData, width=700, height=120 }) {
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const maxRev = Math.max(...revData);
  const maxBk  = Math.max(...bkData);
  const n = revData.length;
  const barW = (width / n) * 0.5;
  const gap  = width / n;
  const linePts = revData.map((v,i) => {
    const x = i * gap + gap / 2;
    const y = height - 20 - (v / maxRev) * (height - 30);
    return `${x},${y}`;
  }).join(' ');
  const areaFirst = `${gap/2},${height-20}`;
  const areaLast  = `${(n-1)*gap+gap/2},${height-20}`;
  return (
    <div className="stat-card">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
        <div style={{fontFamily:'Caveat',fontWeight:700,fontSize:14}}>Revenue &amp; Bookings over time</div>
        <div style={{display:'flex',gap:16}}>
          <div style={{display:'flex',alignItems:'center',gap:5}}><div style={{width:12,height:3,background:'#f5a623',borderRadius:2}}/><span style={{fontFamily:'Caveat',fontSize:12,color:'#888'}}>Revenue</span></div>
          <div style={{display:'flex',alignItems:'center',gap:5}}><div style={{width:10,height:10,background:'#5b8dd9',borderRadius:2,opacity:0.7}}/><span style={{fontFamily:'Caveat',fontSize:12,color:'#888'}}>Bookings</span></div>
        </div>
      </div>
      <svg width="100%" viewBox={`0 0 ${width} ${height}`} className="graph" preserveAspectRatio="none">
        {bkData.map((v,i) => {
          const barH = (v / maxBk) * (height - 30);
          const x = i * gap + gap/2 - barW/2;
          return <rect key={i} x={x} y={height-20-barH} width={barW} height={barH} fill="#5b8dd9" opacity={0.35} rx={2} />;
        })}
        <polyline points={`${areaFirst} ${linePts} ${areaLast}`} fill="#f5a623" fillOpacity={0.12} stroke="none" />
        <polyline points={linePts} fill="none" stroke="#f5a623" strokeWidth={2.5} strokeLinejoin="round" />
        {revData.map((v,i) => {
          const x = i * gap + gap / 2;
          const y = height - 20 - (v / maxRev) * (height - 30);
          return <circle key={i} cx={x} cy={y} r={3} fill="#f5a623" stroke="#fafaf8" strokeWidth={1.5} />;
        })}
        {months.map((m,i) => (
          <text key={m} x={i * gap + gap/2} y={height-4} textAnchor="middle" fontFamily="DM Mono,monospace" fontSize={8} fill="#aaa">{m}</text>
        ))}
        {[0,0.5,1].map(f => {
          const y = height - 20 - f * (height - 30);
          return <g key={f}>
            <line x1={0} y1={y} x2={width} y2={y} stroke="#ede9e1" strokeWidth={1} strokeDasharray="4,4" />
            <text x={2} y={y-3} fontFamily="DM Mono,monospace" fontSize={7} fill="#bbb">€{Math.round(maxRev*f/1000)}k</text>
          </g>;
        })}
      </svg>
    </div>
  );
}

/* ── ACCOUNT USERS ── */
function AccountUsers() {
  const [users, setUsers] = React.useState([
    { id: 1, name: 'Yvette Reijnen', email: 'yvette@goedgemoed.nl', role: 'Owner', lastActive: '29 Apr 2026 · 09:41', editing: false },
    { id: 2, name: 'Marieke Hoorn', email: 'marieke@goedgemoed.nl', role: 'Admin', lastActive: '14 Mar 2026 · 11:20', editing: false },
  ]);
  const [adding, setAdding] = React.useState(false);
  const [newUser, setNewUser] = React.useState({ name: '', email: '', role: 'Admin' });

  const updateUser = (id, field, val) =>
    setUsers(u => u.map(x => x.id === id ? { ...x, [field]: val } : x));
  const saveUser = (id) => setUsers(u => u.map(x => x.id === id ? { ...x, editing: false } : x));
  const deleteUser = (id) => setUsers(u => u.filter(x => x.id !== id));
  const addUser = () => {
    if (!newUser.email) return;
    setUsers(u => [...u, { ...newUser, id: Date.now(), lastActive: '—', editing: false }]);
    setNewUser({ name: '', email: '', role: 'Admin' });
    setAdding(false);
  };

  return (
    <div className="field-row" style={{ alignItems: 'flex-start' }}>
      <div>
        <div className="field-label">Users</div>
        <div className="field-hint">Login accounts linked to this listing</div>
      </div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 6, flex: 1 }}>
        {users.map(u => (
          <div key={u.id} style={{ border: '1.5px solid #ddd', borderRadius: 6, padding: '10px 12px', background: '#faf9f7', display: 'flex', alignItems: 'center', gap: 10 }}>
            {u.editing ? (
              <div style={{ display: 'flex', gap: 8, flex: 1, flexWrap: 'wrap', alignItems: 'center' }}>
                <input className="sk-input" style={{ width: 130 }} value={u.name} onChange={e => updateUser(u.id, 'name', e.target.value)} placeholder="Name" />
                <input className="sk-input" style={{ width: 190 }} value={u.email} onChange={e => updateUser(u.id, 'email', e.target.value)} placeholder="Email" />
                <select className="sk-input" style={{ width: 100 }} value={u.role} onChange={e => updateUser(u.id, 'role', e.target.value)}>
                  {['Owner', 'Admin', 'Viewer'].map(r => <option key={r}>{r}</option>)}
                </select>
                <button className="sk-btn sk-btn-accent" style={{ fontSize: 12 }} onClick={() => saveUser(u.id)}>Save</button>
                <button className="sk-btn" style={{ fontSize: 12 }} onClick={() => updateUser(u.id, 'editing', false)}>Cancel</button>
              </div>
            ) : (
              <>
                <div style={{ flex: 1, display: 'flex', gap: 16, alignItems: 'center', flexWrap: 'wrap' }}>
                  <span style={{ fontFamily: 'Caveat', fontWeight: 700, fontSize: 14, minWidth: 120 }}>{u.name || '—'}</span>
                  <span style={{ fontFamily: 'Caveat', fontSize: 13, color: '#555', minWidth: 170 }}>{u.email}</span>
                  <span style={{ fontFamily: 'Caveat', fontSize: 12, color: '#888', border: '1px solid #ddd', borderRadius: 20, padding: '1px 10px', background: '#f0ede8' }}>{u.role}</span>
                  <span style={{ fontFamily: 'Caveat', fontSize: 11, color: '#aaa' }}>Active {u.lastActive}</span>
                </div>
                <div style={{ display: 'flex', gap: 6 }}>
                  <button className="sk-btn" style={{ fontSize: 11, padding: '3px 10px' }} onClick={() => updateUser(u.id, 'editing', true)}>Edit</button>
                  <button className="sk-btn sk-btn-danger" style={{ fontSize: 11, padding: '3px 10px' }} onClick={() => deleteUser(u.id)}>Delete</button>
                </div>
              </>
            )}
          </div>
        ))}
        {adding ? (
          <div style={{ border: '1.5px dashed #bbb', borderRadius: 6, padding: '10px 12px', background: '#f5f3ef', display: 'flex', gap: 8, flexWrap: 'wrap', alignItems: 'center' }}>
            <input className="sk-input" style={{ width: 130 }} value={newUser.name} onChange={e => setNewUser(n => ({ ...n, name: e.target.value }))} placeholder="Name" />
            <input className="sk-input" style={{ width: 190 }} value={newUser.email} onChange={e => setNewUser(n => ({ ...n, email: e.target.value }))} placeholder="Email address" />
            <select className="sk-input" style={{ width: 100 }} value={newUser.role} onChange={e => setNewUser(n => ({ ...n, role: e.target.value }))}>
              {['Owner', 'Admin', 'Viewer'].map(r => <option key={r}>{r}</option>)}
            </select>
            <button className="sk-btn sk-btn-accent" style={{ fontSize: 12 }} onClick={addUser}>Add</button>
            <button className="sk-btn" style={{ fontSize: 12 }} onClick={() => setAdding(false)}>Cancel</button>
          </div>
        ) : (
          <button className="sk-btn" style={{ fontSize: 12, alignSelf: 'flex-start' }} onClick={() => setAdding(true)}>+ Add user</button>
        )}
      </div>
    </div>
  );
}
