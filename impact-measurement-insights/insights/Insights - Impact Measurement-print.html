<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<title>Inzichten · Empowr</title>
<meta name="viewport" content="width=1440">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Wallop and Jeko aren't free — substitute close geometric sans pairs. */
  :root {
    /* DM Sans for body (Wallop-like geometric humanist) */
    /* Sora for display (Jeko-like sharper grotesk) */
  }
  html, body { margin: 0; padding: 0; background: rgb(252,250,246); color: rgb(3,3,46); font-family: "DM Sans", Inter, system-ui, sans-serif; }
  * { box-sizing: border-box; }
  /* Substitute Wallop → DM Sans, Jeko → Sora */
  [style*="Wallop"] { font-family: "DM Sans", Inter, system-ui, sans-serif !important; }
  [style*="Jeko"]   { font-family: "Sora", "DM Sans", Inter, system-ui, sans-serif !important; }
  button { font-family: inherit; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.12); border-radius: 999px; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ---------- PRINT ---------- */
  @page { size: A3 landscape; margin: 12mm; }
  @media print {
    html, body { background: rgb(252,250,246) !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    /* Hide sidebar + interactive chrome */
    aside { display: none !important; }
    [data-screen-label="Inzichten"] { padding: 0 !important; max-width: none !important; width: 100% !important; }
    /* Hide Tweaks panel + its trigger */
    [class*="tweaks"], [id*="tweak"], [data-tweaks-root], .tweaks-panel { display: none !important; }
    /* Hide page-header range tabs + buttons so the layout is calm in print */
    header button, header [role="tab"] { display: none !important; }
    /* Cards should never split across pages */
    section[data-card-id], section { break-inside: avoid; page-break-inside: avoid; }
    /* Remove shadows so the PDF stays crisp */
    * { box-shadow: none !important; }
    /* Avoid clipping interactive overflow */
    .recharts-tooltip-wrapper, [data-tooltip] { display: none !important; }
  }
</style>
</head>

<script type="text/babel">
  // Auto-print once everything is ready
  (async () => {
    try {
      if (document.fonts && document.fonts.ready) {
        await document.fonts.ready;
      }
      // Wait for charts to size from ResizeObserver
      await new Promise((r) => setTimeout(r, 1500));
      window.print();
    } catch (e) {
      console.error(e);
      window.print();
    }
  })();
</script>
